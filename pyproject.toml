[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightjar-sim"
version = "0.1.0"
description = "Nightjar: a terminal-first autonomous search simulation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "textual>=0.80,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nightjar = "nightjar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nightjar.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
